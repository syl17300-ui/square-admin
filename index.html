<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Square | Admin Console (Firebase)</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Pretendard:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:          #050810;
      --bg2:         #080c17;
      --panel:       #0f1528;
      --panel2:      #151c35;
      --panel3:      #1a2340;
      --border:      rgba(58,72,130,.70);
      --border2:     rgba(58,72,130,.40);
      --text:        #e8eeff;
      --text2:       #d0d8f0;
      --muted:       #8a95bd;
      --muted2:      #5e6890;

      --neon:        #3b9eff;
      --neon-glow:   rgba(59,158,255,.18);
      --neon-soft:   rgba(59,158,255,.08);
      --neon2:       #5ec8ff;
      --neon-text:   #8dcfff;

      --gold:        #c9a227;
      --gold2:       #f0cb5a;
      --gold-soft:   rgba(201,162,39,.10);
      --green:       #2dcc85;
      --green-soft:  rgba(45,204,133,.10);
      --red:         #f05252;
      --red-soft:    rgba(240,82,82,.10);
      --gray-soft:   rgba(122,133,171,.10);

      --shadow-sm:   0 2px 8px rgba(0,0,0,.35);
      --shadow:      0 8px 32px rgba(0,0,0,.50);
      --shadow-lg:   0 20px 60px rgba(0,0,0,.60);
      --radius:      16px;
      --radius2:     12px;
      --radius3:     8px;
      --focus:       0 0 0 3px rgba(59,158,255,.28);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      animation: none !important;
      transition: none !important;
    }

    html { height:100%; background: var(--bg); }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", ui-sans-serif, system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      letter-spacing: -.15px;
      color: var(--text);
      overflow-x: hidden;

      background:
        radial-gradient(ellipse 1100px 600px at 15% 5%,  rgba(59,158,255,.10) 0%, transparent 65%),
        radial-gradient(ellipse 700px 500px at 88% 20%,  rgba(94,200,255,.07) 0%, transparent 60%),
        radial-gradient(ellipse 800px 600px at 55% 110%, rgba(59,158,255,.06) 0%, transparent 55%),
        linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px),
        linear-gradient(rgba(59,158,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,158,255,.018) 1px, transparent 1px),
        linear-gradient(160deg, #060a18 0%, #050810 60%, #070b1a 100%);

      background-size:
        auto, auto, auto,
        72px 72px, 72px 72px,
        18px 18px, 18px 18px,
        auto;

      background-position: center,center,center, 0 0,0 0, 0 0,0 0, center;
      background-repeat: no-repeat,no-repeat,no-repeat, repeat,repeat, repeat,repeat, no-repeat;
    }

    a { color: inherit; text-decoration: none; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--panel); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted2); }

    /* 로딩 스피너 */
    .spinner {
      border: 3px solid var(--panel2);
      border-top: 3px solid var(--neon);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* 버튼 스타일 */
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: var(--radius3);
      background: var(--panel2);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:hover { background: var(--panel3); }
    .btnNeon {
      background: linear-gradient(135deg, var(--neon) 0%, var(--neon2) 100%);
      color: #fff;
      box-shadow: 0 4px 16px var(--neon-glow);
    }
    .btnNeon:hover { transform: translateY(-1px); box-shadow: 0 6px 24px var(--neon-glow); }
    
    .btnRed { background: var(--red); color: #fff; }
    .btnRed:hover { background: #e04545; }
    
    .btnGreen { background: var(--green); color: #fff; }
    .btnGreen:hover { background: #28b876; }

    /* Input */
    .input {
      width: 100%;
      padding: 12px 16px;
      background: var(--panel);
      border: 1px solid var(--border2);
      border-radius: var(--radius3);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
    }
    .input:focus {
      outline: none;
      border-color: var(--neon);
      box-shadow: var(--focus);
    }

    /* 카드 */
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: var(--shadow);
    }

    /* 토스트 */
    .toast {
      position: fixed;
      bottom: 32px;
      right: 32px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius2);
      padding: 16px 24px;
      box-shadow: var(--shadow-lg);
      z-index: 9999;
      min-width: 280px;
    }
    .toastTitle { font-weight: 700; color: var(--neon); margin-bottom: 4px; }
    .toastMessage { color: var(--text2); font-size: 13px; }

    /* 로그인 화면 */
    #loginView {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .loginCard {
      width: 100%;
      max-width: 420px;
    }
    .loginLogo {
      font-size: 48px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon) 0%, var(--neon2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: -2px;
    }
    .loginSubtitle {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 48px;
    }
    .field {
      margin-bottom: 20px;
    }
    .label {
      display: block;
      margin-bottom: 8px;
      color: var(--text2);
      font-size: 14px;
      font-weight: 600;
    }

    /* 앱 화면 */
    #appView {
      display: none;
      padding: 24px;
      max-width: 1800px;
      margin: 0 auto;
    }

    /* 헤더 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding: 24px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .headerTitle {
      font-size: 32px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon) 0%, var(--neon2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .headerUser {
      color: var(--muted);
      font-size: 14px;
    }

    /* 테이블 */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th {
      background: var(--panel2);
      color: var(--text2);
      padding: 12px 16px;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid var(--border);
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border2);
    }
    tr:hover {
      background: var(--panel2);
    }

    .tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    .tag.green { background: var(--green-soft); color: var(--green); }
    .tag.red { background: var(--red-soft); color: var(--red); }
    .tag.gold { background: var(--gold-soft); color: var(--gold); }
    .tag.gray { background: var(--gray-soft); color: var(--muted); }
  </style>
</head>
<body>

  <!-- 로그인 화면 -->
  <div id="loginView">
    <div class="card loginCard">
      <div class="loginLogo">SQUARE</div>
      <div class="loginSubtitle">Admin Console · Firebase Edition</div>
      
      <div class="field">
        <label class="label">아이디</label>
        <input id="loginId" class="input" placeholder="아이디 입력" />
      </div>
      
      <div class="field">
        <label class="label">비밀번호</label>
        <input id="loginPw" class="input" type="password" placeholder="비밀번호 입력" />
      </div>
      
      <button class="btn btnNeon" style="width:100%;margin-top:24px;" onclick="doLogin()">
        로그인
      </button>
    </div>
  </div>

  <!-- 앱 화면 -->
  <div id="appView">
    <div class="header">
      <div class="headerTitle">SQUARE</div>
      <div class="headerUser">
        <span id="whoText">로딩중...</span>
        <button class="btn" style="margin-left:16px;" onclick="doLogout()">로그아웃</button>
      </div>
    </div>

    <div class="card">
      <h2>대시보드</h2>
      <p id="dashboardContent">Firebase로 전환 완료! 데이터를 불러오는 중...</p>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    import { getFirestore, collection, getDocs, doc, getDoc, setDoc, updateDoc, deleteDoc, query, where, orderBy } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    // Firebase 설정
    const firebaseConfig = {
      apiKey: "AIzaSyDAEVp3hRI_x5RLLVBFf932K7ddn3_zTFY",
      authDomain: "square-6699b.firebaseapp.com",
      projectId: "square-6699b",
      storageBucket: "square-6699b.firebasestorage.app",
      messagingSenderId: "1057220560699",
      appId: "1:1057220560699:web:9d3431a11c25ce47f8191e"
    };

    // Firebase 초기화
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 전역 변수
    window.auth = auth;
    window.db = db;
    window.currentUser = null;
    window.userProfile = null;

    // 토스트 함수
    window.toast = function(title, message = '') {
      const existing = document.querySelector('.toast');
      if(existing) existing.remove();
      
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `
        <div class="toastTitle">${title}</div>
        ${message ? `<div class="toastMessage">${message}</div>` : ''}
      `;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    };

    // 로그인
    window.doLogin = async function() {
      const loginId = document.getElementById('loginId').value.trim();
      const password = document.getElementById('loginPw').value.trim();
      
      if(!loginId || !password) {
        toast('입력 오류', '아이디와 비밀번호를 입력하세요');
        return;
      }

      try {
        // Firebase는 이메일로 로그인하므로 @square.com 추가
        const email = loginId.includes('@') ? loginId : `${loginId}@square.com`;
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        window.currentUser = userCredential.user;
        
        toast('로그인 성공', '환영합니다!');
      } catch(error) {
        console.error('로그인 에러:', error);
        toast('로그인 실패', '아이디 또는 비밀번호를 확인하세요');
      }
    };

    // 로그아웃
    window.doLogout = async function() {
      try {
        await signOut(auth);
        toast('로그아웃 완료');
      } catch(error) {
        console.error('로그아웃 에러:', error);
      }
    };

    // 인증 상태 감지
    onAuthStateChanged(auth, async (user) => {
      if(user) {
        window.currentUser = user;
        
        // 사용자 프로필 가져오기
        try {
          const profileDoc = await getDoc(doc(db, 'profiles', user.uid));
          if(profileDoc.exists()) {
            window.userProfile = profileDoc.data();
            document.getElementById('whoText').textContent = 
              `${userProfile.company_name || userProfile.login_id} (${userProfile.role || 'USER'})`;
          }
        } catch(error) {
          console.error('프로필 로드 에러:', error);
        }
        
        // UI 전환
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('appView').style.display = 'block';
        
      } else {
        window.currentUser = null;
        window.userProfile = null;
        document.getElementById('loginView').style.display = 'grid';
        document.getElementById('appView').style.display = 'none';
      }
    });

    console.log('✅ Firebase 초기화 완료!');
  </script>

</body>
</html>
